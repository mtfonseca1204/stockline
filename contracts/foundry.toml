[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["morpho-blue/=lib/morpho-blue/", "forge-std/=lib/forge-std/src/", "@openzeppelin/=lib/openzeppelin-contracts/", "morpho-blue-irm/=lib/morpho-blue-irm/", "base-std/=lib/base-std/src/", "base-std-test/=lib/base-std/test/"]
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]
[profile.default.fuzz]
runs = 256
[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true
